[project]
name = "blast-radius-analyzer"
version = "0.1.0"
description = "Retrieval-augmented blast-radius analysis for vulnerabilities: which hosts are affected, which to fix first, and what the data says to do."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "fastembed>=0.4",
  "numpy>=1.26",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "uvicorn>=0.32",
]

# The language model is optional: search, host resolution and ranking run
# without it, so a deployment that never writes prose never pulls the SDK in.
[project.optional-dependencies]
anthropic = ["anthropic>=1.6,<2"]
openai = ["openai>=1.50"]

[project.scripts]
blast-radius = "blast_radius.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "isort>=5.13",
  "mypy>=1.13",
  "pyink>=24.10",
  "pylint>=3.3",
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blast_radius"]

# ---------------------------------------------------------------------------
# Style: Google Python style as practised in google3 (2-space indentation,
# 80 columns, module imports, Google docstrings). pyink is Google's fork of
# black that encodes those conventions.
# ---------------------------------------------------------------------------
[tool.pyink]
line-length = 80
target-version = ["py312"]
pyink-indentation = 2
pyink-use-majority-quotes = true

[tool.isort]
profile = "google"
line_length = 80
known_first_party = ["blast_radius"]

[tool.mypy]
python_version = "3.12"
packages = ["blast_radius"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

# fastembed ships no type information.
[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
